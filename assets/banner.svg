<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:14px;overflow:hidden;">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes floatLeft {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0px); }
      }
      @keyframes floatRight {
        0% { transform: translateX(0px); }
        50% { transform: translateX(45px); }
        100% { transform: translateX(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .bg-pulse-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 300px 120px;
      }
      .bg-pulse-2 {
        animation: pulseGlow 8s ease-in-out infinite 2s;
        transform-origin: 900px 240px;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: dashAnim 4s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 10 14;
        animation: dashAnim 6s linear infinite reverse;
      }
      .pill-row-top {
        animation: floatRight 16s ease-in-out infinite;
      }
      .pill-row-bottom {
        animation: floatLeft 18s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind Text) -->
  <g opacity="0.4">
    <!-- Ambient glowing nebulas -->
    <circle class="bg-pulse-1" cx="320" cy="110" r="140" fill="#6366f1" filter="url(#glow)" />
    <circle class="bg-pulse-2" cx="880" cy="220" r="160" fill="#0284c7" filter="url(#glow)" />
    <circle cx="600" cy="300" r="120" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

    <!-- Animated Data Stream Lines -->
    <path class="stream-line" d="M 0 100 Q 300 40 600 120 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6" />
    <path class="stream-line-rev" d="M 0 260 Q 400 320 800 240 T 1200 280" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.5" />
    <path class="stream-line" d="M 0 190 Q 500 130 900 220 T 1200 170" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.35" />
  </g>

  <!-- SUBTLE FLOATING TECH PILLS IN LOWER BACKGROUND -->
  <g class="pill-row-bottom" opacity="0.25">
    <rect x="80" y="295" width="90" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="125" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">Next.js</text>

    <rect x="200" y="295" width="80" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="240" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">Nuxt</text>

    <rect x="310" y="295" width="85" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
    <text x="352" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">Astro</text>

    <rect x="425" y="295" width="95" height="28" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="1" />
    <text x="472" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">SvelteKit</text>

    <rect x="550" y="295" width="75" height="28" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <text x="587" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">Rails</text>

    <rect x="655" y="295" width="90" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="700" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">FastAPI</text>

    <rect x="775" y="295" width="90" height="28" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="820" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">Django</text>

    <rect x="895" y="295" width="85" height="28" rx="14" fill="#1e293b" stroke="#e11d48" stroke-width="1" />
    <text x="937" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">NestJS</text>

    <rect x="1010" y="295" width="85" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
    <text x="1052" y="313" fill="#94a3b8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" text-anchor="middle">Laravel</text>
  </g>

  <!-- FOREGROUND: HEADER & TITLES (Crystal Clear & Crisp) -->
  <g id="foregroundContent">
    <!-- Category Tag -->
    <rect x="475" y="45" width="250" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="65" fill="#a5b4fc" font-size="12.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ PRODUCTION ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#primaryGrad)" font-size="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#softGlow)">
      Awesome Full-Stack Web Frameworks
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#e2e8f0" font-size="17" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="500" text-anchor="middle">
      Curated Guide to Meta-Frameworks, SSR Architectures &amp; Cloud Deployment Platforms
    </text>

    <!-- Key Feature Pills (Static & Clear in Foreground) -->
    <g transform="translate(300, 222)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="34" y="22" fill="#cbd5e1" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600">React &bull; Vue &bull; Svelte</text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="195" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="215" cy="17" r="5" fill="#10b981" />
      <text x="229" y="22" fill="#cbd5e1" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600">Python &bull; Ruby &bull; PHP</text>

      <!-- Pill 3 -->
      <rect x="405" y="0" width="195" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="425" cy="17" r="5" fill="#c084fc" />
      <text x="439" y="22" fill="#cbd5e1" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600">SSR &bull; Edge &bull; Full-Stack</text>
    </g>
  </g>
</svg>
