<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (SMIL Animation, Camo-Safe) -->
  <g id="dynamicBackground">
    <!-- Pulsing ambient glow 1 -->
    <circle cx="300" cy="110" r="150" fill="url(#nebula1)">
      <animate attributeName="r" values="130;165;130" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite" />
    </circle>

    <!-- Pulsing ambient glow 2 -->
    <circle cx="900" cy="230" r="170" fill="url(#nebula2)">
      <animate attributeName="r" values="150;185;150" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Pulsing ambient glow 3 -->
    <circle cx="600" cy="290" r="130" fill="url(#nebula3)">
      <animate attributeName="r" values="115;145;115" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Dynamic Stream Lines -->
    <path d="M 0 100 Q 300 40 600 120 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="8 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="6s" repeatCount="indefinite" />
    </path>

    <path d="M 0 255 Q 400 315 800 235 T 1200 275" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.45" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" from="0" to="240" dur="8s" repeatCount="indefinite" />
    </path>

    <path d="M 0 185 Q 500 135 900 215 T 1200 175" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Floating Background Tech Pills with SMIL horizontal translation -->
    <g opacity="0.32">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; -45,0; 0,0" dur="14s" repeatCount="indefinite" />
        <rect x="80" y="295" width="85" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="122" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Next.js</text>

        <rect x="195" y="295" width="75" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
        <text x="232" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Nuxt</text>

        <rect x="300" y="295" width="80" height="26" rx="13" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
        <text x="340" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Astro</text>

        <rect x="410" y="295" width="90" height="26" rx="13" fill="#1e293b" stroke="#f97316" stroke-width="1" />
        <text x="455" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">SvelteKit</text>

        <rect x="530" y="295" width="75" height="26" rx="13" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
        <text x="567" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Rails</text>

        <rect x="635" y="295" width="85" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <text x="677" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">FastAPI</text>

        <rect x="750" y="295" width="85" height="26" rx="13" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
        <text x="792" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Django</text>

        <rect x="865" y="295" width="80" height="26" rx="13" fill="#1e293b" stroke="#e11d48" stroke-width="1" />
        <text x="905" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">NestJS</text>

        <rect x="975" y="295" width="85" height="26" rx="13" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
        <text x="1017" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Laravel</text>

        <rect x="1090" y="295" width="90" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
        <text x="1135" y="312" fill="#94a3b8" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600" text-anchor="middle">Phoenix</text>
      </g>
    </g>
  </g>

  <!-- FOREGROUND: HEADER & TITLES (100% Crisp, High Contrast, Guaranteed Foreground) -->
  <g id="foregroundContent">
    <!-- Category Pill Tag -->
    <rect x="470" y="44" width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="65" fill="#a5b4fc" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ PRODUCTION ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#titleGrad)" font-size="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Awesome Full-Stack Web Frameworks
    </text>

    <!-- Subtitle -->
    <text x="600" y="193" fill="#e2e8f0" font-size="16.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-weight="500" text-anchor="middle">
      Curated Guide to Meta-Frameworks, SSR Architectures &amp; Cloud Deployment Platforms
    </text>

    <!-- Key Feature Pills (Crystal Clear in Foreground) -->
    <g transform="translate(300, 222)">
      <!-- Feature Card 1 -->
      <rect x="0" y="0" width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="34" y="22" fill="#cbd5e1" font-size="13" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">React • Vue • Svelte</text>

      <!-- Feature Card 2 -->
      <rect x="200" y="0" width="195" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="220" cy="17" r="5" fill="#10b981" />
      <text x="234" y="22" fill="#cbd5e1" font-size="13" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">Python • Ruby • PHP</text>

      <!-- Feature Card 3 -->
      <rect x="415" y="0" width="185" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="435" cy="17" r="5" fill="#c084fc" />
      <text x="449" y="22" fill="#cbd5e1" font-size="13" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="600">SSR • Edge • Full-Stack</text>
    </g>
  </g>
</svg>
